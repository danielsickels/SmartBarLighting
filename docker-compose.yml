services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbar-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app  
    env_file:
      - ./app/.env  
    environment:
      # OVERRIDE MinIO settings for Docker networking
      # These take precedence over values in .env file
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
    command: bash -c "poetry install --no-root && poetry run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: smartbar-minio
    ports:
      - "9000:9000"   
      - "9001:9001"   
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
